<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Details</title>

    <meta name="description"
          content="View complete recipe details including ingredients, instructions, serving suggestions, and chef tips.">

    <link rel="stylesheet" href="css/recipe.css">
</head>

<body>

    <!-- ================= BACK BUTTON ================= -->

    <button
        class="back-btn"
        type="button"
        onclick="history.back()"
        aria-label="Go back">

        ← Back

    </button>

    <!-- ================= HERO ================= -->

    <header id="hero">

        <div class="hero-overlay">

            <div class="hero-content">

                <span
                    class="recipe-category"
                    id="category">
                </span>

                <h1 id="title">
                    Loading Recipe...
                </h1>

                <p
                    class="recipe-description"
                    id="description">
                </p>

                <div class="recipe-meta">

                    <span id="time"></span>

                    <span id="difficulty"></span>

                </div>

            </div>

        </div>

    </header>

    <!-- ================= MAIN CONTENT ================= -->

    <main class="recipe-layout">

        <!-- Ingredients -->

        <aside
            class="ingredients-panel"
            aria-label="Ingredients">

            <div id="ingredients"></div>

        </aside>

        <!-- Recipe Content -->

        <section
            class="instructions-panel"
            aria-label="Recipe Instructions">

            <div id="instructions"></div>

            <div id="servingsuggestions"></div>

            <div id="tips"></div>

        </section>

    </main>

    <script src="js/recipe.js"></script>

</body>

</html>
