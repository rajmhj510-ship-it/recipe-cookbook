<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<meta
name="description"
content="View ingredients, instructions, tips, and serving suggestions for this recipe."

>

  <title>Recipe | Recipe Cookbook</title>

  <!-- Recipe Styles -->

  <link rel="stylesheet" href="css/recipe.css">
</head>

<body>

  <!-- =========================
       BACK BUTTON
  ========================== -->

<button
class="back-btn"
type="button"
onclick="history.back()"
aria-label="Go back to the previous page"

>

```
← Back
```

  </button>

  <!-- =========================
       RECIPE HERO
  ========================== -->

  <header id="hero">

```
<div class="hero-overlay">

  <div class="hero-content">

    <!-- Recipe Category -->
    <span
      class="recipe-category"
      id="category"
    ></span>

    <!-- Recipe Title -->
    <h1 id="title">
      Loading Recipe...
    </h1>

    <!-- Recipe Description -->
    <p
      class="recipe-description"
      id="description"
    ></p>

    <!-- Recipe Meta Information -->
    <div class="recipe-meta">

      <span id="time"></span>

      <span id="difficulty"></span>

    </div>

  </div>

</div>
```

  </header>

  <!-- =========================
       MAIN RECIPE CONTENT
  ========================== -->

  <main class="recipe-layout">

```
<!-- =========================
     INGREDIENTS
========================== -->
<aside
  class="ingredients-panel"
  aria-label="Recipe ingredients"
>

  <div id="ingredients"></div>

</aside>


<!-- =========================
     INSTRUCTIONS & TIPS
========================== -->
<section
  class="instructions-panel"
  aria-label="Recipe instructions"
>

  <!-- Cooking Instructions -->
  <div id="instructions"></div>

  <!-- Serving Suggestions -->
  <div id="servingsuggestions"></div>

  <!-- Cooking Tips -->
  <div id="tips"></div>

</section>
```

  </main>

  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="js/recipe.js"></script>

</body>
</html>
