```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe</title>

    <link rel="stylesheet" href="css/recipe.css">
</head>

<body>

    <!-- ================= BACK BUTTON ================= -->

    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>


    <!-- ================= RECIPE HERO ================= -->

    <header id="hero">

        <!-- Background image used for the large hero -->
        <div class="hero-background"></div>


        <!-- Main recipe information -->

        <div class="hero-content">

            <!-- Recipe photo -->

            <div class="recipe-photo">
                <img
                    id="recipeImage"
                    src=""
                    alt="Recipe"
                >
            </div>


            <!-- Recipe information -->

            <div class="recipe-info">

                <!-- Category -->

                <span
                    class="recipe-category"
                    id="category">
                </span>


                <!-- Recipe name -->

                <h1 id="title">
                    Loading Recipe...
                </h1>


                <!-- Description -->

                <p
                    class="recipe-description"
                    id="description">
                </p>


                <!-- Time + difficulty -->

                <div class="recipe-meta">

                    <span id="time"></span>

                    <span id="difficulty"></span>

                </div>

            </div>

        </div>

    </header>



    <!-- ================= RECIPE CONTENT ================= -->

    <main class="recipe-layout">


        <!-- ================= INGREDIENTS ================= -->

        <aside class="ingredients-panel">

            <div id="ingredients"></div>

        </aside>



        <!-- ================= INSTRUCTIONS ================= -->

        <section class="instructions-panel">

            <div id="instructions"></div>


            <!-- ================= SERVING SUGGESTIONS ================= -->

            <div id="servingsuggestions"></div>


            <!-- ================= CHEF TIPS ================= -->

            <div id="tips"></div>

        </section>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/recipe.js"></script>

</body>

</html>
```
