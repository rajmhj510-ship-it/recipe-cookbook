<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0"
/>

<meta
 name="description"
 content="Explore delicious recipes from around the world and cook like a chef."
/>

  <title>Recipe Cookbook | Cook Like a Chef</title>

  <!-- Stylesheets -->

  <link rel="stylesheet" href="css/carousel.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>

<body>

  <!-- =========================
       HERO SECTION
  ========================== -->

  <section id="hero" aria-label="Featured recipes">

```
<h1 class="about-title">COOK LIKE A CHEF</h1>

<div class="carousel-container">

  <button
    class="nav-arrow left"
    type="button"
    aria-label="Previous recipe"
  >
    ‹
  </button>

  <div
    class="carousel-track"
    aria-live="polite"
  ></div>

  <button
    class="nav-arrow right"
    type="button"
    aria-label="Next recipe"
  >
    ›
  </button>

</div>

<div class="recipe-info">
  <h2 class="hero-recipe-title"></h2>
  <p class="recipe-meta"></p>
</div>

<button
  class="scroll-down"
  type="button"
  aria-label="Explore recipes"
>
  ↓ Explore Recipes
</button>
```

  </section>

  <!-- =========================
       EXPLORE RECIPES SECTION
  ========================== -->

  <section id="explore" aria-label="Explore recipes">

```
<!-- Sticky Header / Filters -->
<div class="sticky-block">

  <header class="explore-header">

    <div class="brand-small">
      <img
        src="logo.png"
        class="logo"
        alt="Recipe Cookbook logo"
      />

      <h2>Recipes</h2>
    </div>

  </header>


  <!-- Search -->
  <div class="search-wrapper">

    <label for="searchInput" class="sr-only">
      Search recipes
    </label>

    <input
      type="search"
      id="searchInput"
      placeholder="Search recipes..."
      autocomplete="off"
    />

  </div>


  <!-- Recipe Categories -->
  <nav
    class="filters"
    aria-label="Recipe categories"
  >

    <button
      type="button"
      class="active"
      data-cat="all"
    >
      All
    </button>

    <button type="button" data-cat="Arabic">
      Arabic
    </button>

    <button type="button" data-cat="Chinese">
      Chinese
    </button>

    <button type="button" data-cat="Indian">
      Indian
    </button>

    <button type="button" data-cat="Continental">
      Continental
    </button>

    <button type="button" data-cat="Mexican">
      Mexican
    </button>

    <button type="button" data-cat="Nepali">
      Nepali
    </button>

    <button type="button" data-cat="Thai">
      Thai
    </button>

    <button type="button" data-cat="Italian">
      Italian
    </button>

    <button type="button" data-cat="Indo-Chinese">
      Indo-Chinese
    </button>

    <button type="button" data-cat="Spanish">
      Spanish
    </button>

    <button type="button" data-cat="Turkish">
      Turkish
    </button>

  </nav>

</div>


<!-- Dynamic Recipe Content -->
<div
  id="recipeList"
  aria-live="polite"
></div>
```

  </section>

  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="js/carousel.js"></script>

  <script src="js/home.js"></script>

</body>
</html>
